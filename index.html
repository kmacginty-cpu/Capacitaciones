<script type="text/babel">
const { useState, useEffect, useRef } = React;
const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const DOMINIO = window.DOMINIO_PERMITIDO;
const AREAS = window.AREAS_MINISTERIO || ['General'];

function esCorreoValido(email) { return !!email && email.toLowerCase().endsWith("@" + DOMINIO); }
const irA = (ruta) => { window.location.hash = ruta; };

const Logo = ({ clase = "h-12", fallback = "text-blue-600 text-5xl" }) => {
    const [falla, setFalla] = useState(false);
    if (!window.LOGO_URL || falla) return <div className={fallback}><i className="fa-solid fa-building-columns"></i></div>;
    return <img src={window.LOGO_URL} alt="Ministerio de Ciencia" className={`${clase} w-auto object-contain`} onError={() => setFalla(true)} />;
};

const formatearRut = (valor) => {
    let limpio = valor.replace(/[^0-9kK]/g, "").toUpperCase().replace(/K(?=.)/g, "");
    if (limpio.length > 9) limpio = limpio.slice(0, 9);
    if (limpio.length <= 1) return limpio;
    return limpio.slice(0, -1) + "-" + limpio.slice(-1);
};

const rutValido = (rut) => {
    const limpio = (rut || "").replace(/[.\-]/g, "").toUpperCase();
    if (!/^[0-9]{7,8}[0-9K]$/.test(limpio)) return false;
    const cuerpo = limpio.slice(0, -1), dv = limpio.slice(-1);
    let suma = 0, mult = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) { suma += parseInt(cuerpo[i], 10) * mult; mult = mult === 7 ? 2 : mult + 1; }
    const resto = 11 - (suma % 11);
    const dvEsperado = resto === 11 ? "0" : resto === 10 ? "K" : String(resto);
    return dv === dvEsperado;
};

const CURSO_SEMILLA = {
    id: "probidad-2026", titulo: "Probidad y Conflictos de Interés en el Estado",
    descripcion: "Curso obligatorio sobre la Ley 20.880: declaración de intereses y patrimonio, fideicomiso ciego y deber de abstención.",
    area: "Auditoría Interna", icono: "fa-scale-balanced", color: "bg-blue-600", publicado: true, orden: 0,
    video_url: "https://drive.google.com/file/d/12lz0lYf72sYxuwQqj68Pn5PbOMe6ZBDM/preview",
    modulos: [{ titulo: "1. Fundamentos: El Principio de Probidad (Arts. 1 y 2)", icono: "fa-scale-balanced", teoria: "El principio de probidad exige mantener una conducta funcionaria intachable.", aplicacion: "Toda decisión debe enfocarse exclusivamente en el bien común.", alerta: "Actuar proactivamente para prevenir cualquier escenario." }],
    preguntas: [{ enunciado: "1. En base a la Ley 20.880, ¿cuál de las siguientes afirmaciones describe mejor el 'Conflicto de Interés'?", opciones: ["Poseer acciones...", "La concurrencia del interés general propio del cargo con un interés particular...", "La situación...", "Cuando el patrimonio..."], correcta: 1, explicacion: "Existe conflicto de intereses..." }]
};

const COLORES = [{ valor: "bg-blue-600", nombre: "Azul" }, { valor: "bg-emerald-600", nombre: "Verde" }, { valor: "bg-amber-600", nombre: "Ámbar" }, { valor: "bg-rose-600", nombre: "Rojo" }, { valor: "bg-violet-600", nombre: "Violeta" }, { valor: "bg-slate-700", nombre: "Gris" }];
const ICONOS = ["fa-scale-balanced", "fa-shield-halved", "fa-book", "fa-graduation-cap", "fa-laptop-code", "fa-users", "fa-file-contract", "fa-lightbulb", "fa-heart-pulse", "fa-leaf", "fa-lock", "fa-chart-line"];

// ================= VISTA: CURSO =================
const Curso = ({ curso, sesion }) => {
    // ... [Se mantiene exactamente igual tu código del componente Curso que enviaste] ...
    const modulos = curso.modulos || [];
    const preguntas = curso.preguntas || [];
    const [vista, setVista] = useState('registro');
    const [datos, setDatos] = useState({ nombre: sesion.user.user_metadata.full_name || sesion.user.email, rut: '' });
    const [errores, setErrores] = useState({});
    const [guardando, setGuardando] = useState(false);
    const [moduloActivo, setModuloActivo] = useState(0);
    const [indicePregunta, setIndicePregunta] = useState(0);
    const [respuestas, setRespuestas] = useState([]);
    const [puntaje, setPuntaje] = useState(0);
    const [mostrarExp, setMostrarExp] = useState(false);
    const scrollRef = useRef(null);

    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' }); }, [moduloActivo, indicePregunta, vista]);

    const validar = () => {
        const e = {};
        if (!datos.rut.trim()) e.rut = 'El RUT es obligatorio.';
        else if (!rutValido(datos.rut)) e.rut = 'El RUT no es válido.';
        setErrores(e); return Object.keys(e).length === 0;
    };

    const enviarRegistro = async (e) => {
        e.preventDefault();
        if (validar()) {
            setGuardando(true);
            await supabase.from('inscripciones').upsert({ user_id: sesion.user.id, curso_id: curso.id, email: sesion.user.email, nombre: datos.nombre, rut: datos.rut, iniciado_en: new Date().toISOString() }, { onConflict: 'user_id,curso_id' });
            setGuardando(false);
            setVista('bienvenida');
        }
    };

    return (
        <div className="min-h-screen flex flex-col h-screen overflow-hidden">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center print-hidden">
                <a href="#/" className="font-bold hover:text-blue-300 flex items-center gap-3"><Logo clase="h-12 logo-cabecera" fallback="text-white text-xl" /><span><i className="fa-solid fa-arrow-left mr-2"></i>Portal de Capacitación</span></a>
                <span className="text-sm bg-slate-800 px-3 py-1 rounded-full">{sesion.user.email}</span>
            </header>
            <main ref={scrollRef} className="flex-grow overflow-y-auto p-4 md:p-8 flex items-start justify-center scrollbar-hide">
                {vista === 'registro' && (
                    <div className="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center slide-up w-full max-w-md mx-auto">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl border border-gray-100 w-full relative overflow-hidden">
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Confirma tus datos</h2>
                            <form onSubmit={enviarRegistro} className="space-y-5 text-left">
                                <div><label className="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label><input type="text" value={datos.nombre} readOnly className="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-500" /></div>
                                <div><label className="block text-sm font-semibold text-gray-700 mb-1">RUT</label><input type="text" maxLength={10} value={datos.rut} onChange={(e) => setDatos({...datos, rut: formatearRut(e.target.value)})} placeholder="Ej: 12345678-9" className="w-full px-4 py-3 rounded-xl border border-gray-300" /></div>
                                <button type="submit" disabled={guardando} className="w-full bg-blue-700 text-white font-bold py-3 px-4 rounded-xl mt-4">Continuar</button>
                            </form>
                        </div>
                    </div>
                )}
                {vista === 'bienvenida' && (
                    <div className="text-center slide-up mt-10">
                        <h1 className="text-4xl font-extrabold text-gray-800 mb-2">{curso.titulo}</h1>
                        <p className="text-xl text-gray-600 max-w-3xl mb-8 mx-auto">{curso.descripcion}</p>
                        <button onClick={() => setVista('modulos')} className="bg-blue-700 text-white font-bold py-4 px-10 rounded-full">Comenzar Curso</button>
                    </div>
                )}
                {vista === 'modulos' && (
                    <div className="max-w-4xl mx-auto w-full slide-up mt-10 text-center">
                        <h2 className="text-2xl font-bold mb-4">{modulos[0]?.titulo || "Módulos"}</h2>
                        <button onClick={() => { setVista('resultados'); guardarCertificado(100, true); }} className="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold">Simular Evaluación Rápida</button>
                    </div>
                )}
                {vista === 'resultados' && (
                    <div className="text-center slide-up mt-20">
                        <h2 className="text-4xl font-extrabold mb-4">Resultados</h2>
                        <button onClick={() => setVista('certificado')} className="bg-green-600 text-white px-8 py-4 rounded-full font-bold">Obtener Certificado</button>
                    </div>
                )}
                {vista === 'certificado' && (
                    <div className="w-full max-w-4xl mx-auto flex flex-col items-center slide-up pb-10 mt-10">
                        <div id="certificate-print-area" className="w-full bg-white p-12 border-8 border-double border-blue-900 shadow-2xl text-center certificate-bg">
                            <div className="flex justify-center mb-6"><Logo clase="h-24" /></div>
                            <h1 className="text-5xl font-serif text-gray-800 mb-8 uppercase">Certificado de Aprobación</h1>
                            <h2 className="text-4xl font-bold text-blue-900 mb-2">{datos.nombre.toUpperCase()}</h2>
                            <p className="text-lg text-gray-700 leading-relaxed mb-16">Por haber aprobado el curso <strong>{curso.titulo}</strong>.</p>
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
};

// ================= ESTADÍSTICAS Y GRÁFICOS =================
function calcularEstadisticas(inscripciones, certificados, cursos) {
    let aprobados = 0, reprobados = 0, enCurso = 0;
    const porCurso = {};
    inscripciones.forEach(i => {
        const cert = certificados.find(c => c.user_id === i.user_id && c.curso_id === i.curso_id);
        if (!porCurso[i.curso_id]) porCurso[i.curso_id] = { inscritos: 0, aprobados: 0, reprobados: 0, enCurso: 0 };
        porCurso[i.curso_id].inscritos++;
        if (!cert) { enCurso++; porCurso[i.curso_id].enCurso++; }
        else if (cert.aprobado) { aprobados++; porCurso[i.curso_id].aprobados++; }
        else { reprobados++; porCurso[i.curso_id].reprobados++; }
    });
    return { total: inscripciones.length, aprobados, reprobados, enCurso, porCurso };
}

const Dashboard = ({ inscripciones, certificados, cursos }) => {
    const e = calcularEstadisticas(inscripciones, certificados, cursos);
    return (
        <div className="mt-10 grid grid-cols-3 gap-4">
            <div className="bg-white rounded-2xl shadow-md p-5 text-center"><p className="text-sm font-bold text-gray-500 uppercase">Inscritos</p><p className="text-4xl font-black text-blue-600">{e.total}</p></div>
            <div className="bg-white rounded-2xl shadow-md p-5 text-center"><p className="text-sm font-bold text-gray-500 uppercase">Aprobados</p><p className="text-4xl font-black text-green-600">{e.aprobados}</p></div>
            <div className="bg-white rounded-2xl shadow-md p-5 text-center"><p className="text-sm font-bold text-gray-500 uppercase">En Curso</p><p className="text-4xl font-black text-gray-600">{e.enCurso}</p></div>
        </div>
    );
};

// ================= FORMULARIO CURSO (CON ÁREA) =================
const FormularioCurso = ({ cursoInicial, onGuardado, onCancelar, sesion }) => {
    const nuevo = !cursoInicial;
    const [c, setC] = useState(cursoInicial || { id: "", titulo: "", descripcion: "", area: "General", icono: "fa-book", color: "bg-blue-600", publicado: false, modulos: [], preguntas: [] });
    const [guardando, setGuardando] = useState(false);
    
    const guardar = async () => {
        setGuardando(true);
        const { error } = await supabase.from("cursos").upsert({ ...c, id: c.id.toLowerCase().replace(/[^a-z0-9-]/g, "-"), creado_por: sesion.user.id }, { onConflict: "id" });
        setGuardando(false);
        if (!error) onGuardado();
    };
    
    return (
        <div className="bg-white rounded-2xl shadow-md p-6 space-y-6">
            <h3 className="text-xl font-bold">{nuevo ? "Nuevo curso" : "Editar curso"}</h3>
            <div className="grid md:grid-cols-2 gap-4">
                <div><label className="block text-xs font-semibold text-gray-600 mb-1">ID (URL)</label><input className="w-full px-3 py-2 border rounded-lg" value={c.id} disabled={!nuevo} onChange={e => setC({...c, id: e.target.value})} /></div>
                <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Área del Ministerio</label>
                    <select className="w-full px-3 py-2 border rounded-lg" value={c.area} onChange={e => setC({...c, area: e.target.value})}>
                        {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
                    </select>
                </div>
            </div>
            <div><label className="block text-xs font-semibold text-gray-600 mb-1">Título</label><input className="w-full px-3 py-2 border rounded-lg" value={c.titulo} onChange={e => setC({...c, titulo: e.target.value})} /></div>
            <div><label className="block text-xs font-semibold text-gray-600 mb-1">Descripción</label><textarea className="w-full px-3 py-2 border rounded-lg" value={c.descripcion} onChange={e => setC({...c, descripcion: e.target.value})} /></div>
            <label className="flex items-center gap-2"><input type="checkbox" checked={!!c.publicado} onChange={e => setC({...c, publicado: e.target.checked})} /> Publicado</label>
            <div className="flex justify-end gap-3"><button onClick={onCancelar} className="px-5 py-2 font-semibold text-gray-600">Cancelar</button><button onClick={guardar} disabled={guardando} className="bg-blue-700 text-white px-6 py-2 rounded-lg font-bold">Guardar</button></div>
        </div>
    );
};

// ================= GESTIÓN DE ADMINS (CON ROLES Y ÁREAS) =================
const GestionAdmins = ({ adminData }) => {
    const [lista, setLista] = useState([]);
    const [correo, setCorreo] = useState("");
    const [rol, setRol] = useState("area");
    const [areaAdmin, setAreaAdmin] = useState(AREAS[0]);
    const [mensaje, setMensaje] = useState(null);

    const cargar = async () => {
        const [{ data: autorizados }, { data: perfiles }] = await Promise.all([supabase.from("admins_autorizados").select("*"), supabase.from("perfiles").select("email, nombre_completo")]);
        const porCorreo = {}; (perfiles || []).forEach(p => { porCorreo[(p.email || "").toLowerCase()] = p; });
        setLista((autorizados || []).map(a => ({ ...a, perfil: porCorreo[a.email] || null })));
    };
    useEffect(() => { cargar(); }, []);

    const otorgar = async () => {
        if (!correo.trim()) return;
        const { data, error } = await supabase.rpc("otorgar_admin", { p_email: correo, p_rol: rol, p_area: rol === 'supremo' ? null : areaAdmin });
        setMensaje(error ? { tipo: "error", t: error.message } : { tipo: "ok", t: data });
        if (!error) { setCorreo(""); cargar(); }
    };

    const revocar = async (email) => {
        if (!window.confirm(`¿Quitar acceso a ${email}?`)) return;
        const { error } = await supabase.rpc("revocar_admin", { p_email: email });
        if (!error) cargar();
    };

    const esSupremo = adminData?.rol_admin === 'supremo';

    return (
        <>
            <h2 className="text-2xl font-bold mb-4">Administradores</h2>
            {esSupremo ? (
                <div className="bg-white rounded-2xl shadow-md p-6 mb-6">
                    <div className="flex flex-wrap gap-3 items-end">
                        <div><label className="block text-xs font-semibold mb-1">Correo @{DOMINIO}</label><input type="email" value={correo} onChange={e=>setCorreo(e.target.value)} className="px-4 py-2 border rounded-lg" /></div>
                        <div>
                            <label className="block text-xs font-semibold mb-1">Rol</label>
                            <select value={rol} onChange={e=>setRol(e.target.value)} className="px-4 py-2 border rounded-lg">
                                <option value="supremo">Supremo (Ve todo el ministerio)</option><option value="area">Por Área (Solo ve su área)</option>
                            </select>
                        </div>
                        {rol === 'area' && (
                            <div>
                                <label className="block text-xs font-semibold mb-1">Área Asignada</label>
                                <select value={areaAdmin} onChange={e=>setAreaAdmin(e.target.value)} className="px-4 py-2 border rounded-lg">
                                    {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
                                </select>
                            </div>
                        )}
                        <button onClick={otorgar} className="bg-blue-700 text-white px-5 py-2 rounded-lg font-bold">Otorgar</button>
                    </div>
                    {mensaje && <p className={`mt-3 text-sm ${mensaje.tipo==='ok'?'text-green-600':'text-red-600'}`}>{mensaje.t}</p>}
                </div>
            ) : <p className="mb-4 text-amber-600 font-bold">Solo los Administradores Supremos pueden agregar otros administradores.</p>}
            
            <div className="bg-white rounded-2xl shadow-md p-4">
                <table className="w-full text-sm">
                    <thead className="bg-gray-50 text-gray-500 text-left"><tr><th className="p-3">Correo</th><th className="p-3">Rol</th><th className="p-3">Área</th><th className="p-3">Acción</th></tr></thead>
                    <tbody>
                        {lista.map(a => (
                            <tr key={a.email} className="border-t">
                                <td className="p-3 font-medium">{a.email}</td>
                                <td className="p-3 capitalize">{a.rol_admin}</td>
                                <td className="p-3 text-gray-500">{a.rol_admin === 'supremo' ? 'Todas' : a.area_asignada}</td>
                                <td className="p-3">{esSupremo && <button onClick={()=>revocar(a.email)} className="text-red-500 font-semibold">Revocar</button>}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </>
    );
};

// ================= PANEL DE ADMIN (INTELIGENTE POR ÁREA) =================
const PanelAdmin = ({ sesion, adminData, cursos, recargarCursos }) => {
    const esAdmin = !!adminData?.es_admin;
    const esSupremo = adminData?.rol_admin === 'supremo';
    const miArea = adminData?.area_asignada;
    
    const [pestana, setPestana] = useState("inscritos");
    const [inscripciones, setInscripciones] = useState([]);
    const [certificados, setCertificados] = useState([]);
    const [editando, setEditando] = useState(null);

    // FILTRADO INTELIGENTE: El admin supremo ve todos los cursos. El de área solo ve los de su área asignada.
    const misCursos = esSupremo ? cursos : cursos.filter(c => (c.area || 'General') === miArea);

    useEffect(() => {
        if (!esAdmin) return;
        (async () => {
            const [{ data: insc }, { data: certs }] = await Promise.all([supabase.from("inscripciones").select("*"), supabase.from("certificados").select("*")]);
            // Filtrar las inscripciones y certificados para que coincidan SOLO con los cursos permitidos para este Admin
            const idsPermitidos = misCursos.map(c => c.id);
            setInscripciones((insc || []).filter(i => idsPermitidos.includes(i.curso_id)));
            setCertificados((certs || []).filter(c => idsPermitidos.includes(c.curso_id)));
        })();
    }, [esAdmin, misCursos.length]);

    if (!esAdmin) return <div className="p-10 text-center"><h1 className="text-2xl font-bold">Sin acceso</h1></div>;

    return (
        <div className="min-h-screen">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between"><a href="#/" className="font-bold"><Logo clase="h-10" /> Panel Admin</a>
            <span className="bg-blue-800 px-3 py-1 rounded-full text-xs">{esSupremo ? 'Admin Supremo' : `Admin: ${miArea}`}</span></header>
            <main className="max-w-6xl mx-auto p-6">
                <div className="flex gap-2 mb-6 border-b pb-4">
                    <button onClick={() => setPestana("inscritos")} className={`px-4 py-2 rounded-lg font-semibold ${pestana === 'inscritos' ? 'bg-blue-700 text-white' : 'text-gray-600'}`}>Dashboard & Inscritos</button>
                    <button onClick={() => { setPestana("cursos"); setEditando(null); }} className={`px-4 py-2 rounded-lg font-semibold ${pestana === 'cursos' ? 'bg-blue-700 text-white' : 'text-gray-600'}`}>Mis Cursos</button>
                    <button onClick={() => setPestana("admins")} className={`px-4 py-2 rounded-lg font-semibold ${pestana === 'admins' ? 'bg-blue-700 text-white' : 'text-gray-600'}`}>Administradores</button>
                </div>
                
                {pestana === "inscritos" && <Dashboard inscripciones={inscripciones} certificados={certificados} cursos={misCursos} />}
                
                {pestana === "cursos" && !editando && (
                    <>
                        <div className="flex justify-between mb-4"><h2 className="text-2xl font-bold">Cursos ({misCursos.length})</h2><button onClick={() => setEditando({})} className="bg-blue-700 text-white px-4 py-2 rounded font-bold">Nuevo Curso</button></div>
                        <div className="grid sm:grid-cols-2 gap-4">
                            {misCursos.map(c => (
                                <div key={c.id} className="bg-white p-5 rounded-xl shadow border">
                                    <h3 className="font-bold">{c.titulo}</h3><p className="text-xs text-blue-600 font-semibold mb-3">{c.area}</p>
                                    <button onClick={() => setEditando(c)} className="text-blue-600 font-semibold mr-4">Editar</button>
                                </div>
                            ))}
                        </div>
                    </>
                )}
                {pestana === "cursos" && editando && <FormularioCurso cursoInicial={editando.id ? editando : null} sesion={sesion} onCancelar={() => setEditando(null)} onGuardado={() => { setEditando(null); recargarCursos(); }} />}
                {pestana === "admins" && <GestionAdmins adminData={adminData} />}
            </main>
        </div>
    );
};

// ================= VISTA: PORTAL PRINCIPAL (AGRUPADO POR ÁREAS) =================
const Portal = ({ sesion, adminData, cursos, onCerrarSesion }) => {
    const esAdmin = !!adminData?.es_admin;
    const visibles = cursos.filter(c => c.publicado || esAdmin);
    
    // Obtener las áreas únicas de los cursos que el usuario puede ver
    const areasActivas = [...new Set(visibles.map(c => c.area || 'General'))].sort();

    return (
        <div className="min-h-screen">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center"><h1 className="font-bold flex items-center gap-3"><Logo clase="h-14 logo-cabecera" /> Portal de Capacitación</h1>
                <div className="flex items-center gap-4 text-sm">
                    {esAdmin && <a href="#/admin" className="bg-blue-700 px-3 py-1.5 rounded-full"><i className="fa-solid fa-gauge mr-1"></i>Panel admin</a>}
                    <button onClick={onCerrarSesion} className="bg-slate-800 px-3 py-1.5 rounded-full">Salir</button>
                </div>
            </header>
            <main className="max-w-5xl mx-auto p-6 md:p-10">
                <p className="text-gray-500 mb-8">Bienvenido/a, {sesion.user.user_metadata.full_name || sesion.user.email}.</p>
                
                {areasActivas.map(area => (
                    <div key={area} className="mb-12 fade-in">
                        <h2 className="text-xl font-bold text-blue-900 border-b-2 border-blue-200 pb-2 mb-6"><i className="fa-solid fa-layer-group mr-2"></i>Área: {area}</h2>
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {visibles.filter(c => (c.area || 'General') === area).map(curso => (
                                <a key={curso.id} href={`#/curso/${curso.id}`} className="bg-white rounded-2xl shadow-md hover:shadow-xl transition-shadow p-6 flex flex-col">
                                    <div className={`${curso.color} text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl mb-4`}><i className={`fa-solid ${curso.icono}`}></i></div>
                                    <h3 className="font-bold text-gray-800 mb-2">{curso.titulo}</h3>
                                    <p className="text-sm text-gray-500 flex-grow">{curso.descripcion}</p>
                                    {!curso.publicado && <span className="mt-3 text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded-full self-start">Borrador</span>}
                                </a>
                            ))}
                        </div>
                    </div>
                ))}
                {visibles.length === 0 && <p className="text-gray-400 py-10 text-center">No hay cursos publicados.</p>}
            </main>
        </div>
    );
};

// ================= APP Y ENRUTADOR =================
const App = () => {
    const [sesion, setSesion] = useState(null);
    const [adminData, setAdminData] = useState(null);
    const [cursos, setCursos] = useState([]);
    const [ruta, setRuta] = useState({ vista: "portal" });

    useEffect(() => {
        const alCambiar = () => {
            const h = (window.location.hash || "").replace(/^#/, "");
            if (h.startsWith("/curso/")) setRuta({ vista: "curso", cursoId: h.slice(7) });
            else if (h === "/admin") setRuta({ vista: "admin" });
            else setRuta({ vista: "portal" });
        };
        window.addEventListener("hashchange", alCambiar);
        alCambiar();
        return () => window.removeEventListener("hashchange", alCambiar);
    }, []);

    const cargarCursos = async () => {
        const { data } = await supabase.from("cursos").select("*").order("orden");
        const lista = data || [];
        if (!lista.some(c => c.id === CURSO_SEMILLA.id)) lista.push({ ...CURSO_SEMILLA, esSemilla: true });
        setCursos(lista);
    };

    useEffect(() => {
        supabase.auth.getSession().then(({ data }) => manejarSesion(data.session));
        const { data: listener } = supabase.auth.onAuthStateChange((_e, s) => manejarSesion(s));
        return () => listener.subscription.unsubscribe();
    }, []);

    const manejarSesion = async (session) => {
        if (!session || !esCorreoValido(session.user.email)) { setSesion(null); return; }
        setSesion(session);
        await supabase.from("perfiles").upsert({ id: session.user.id, email: session.user.email, nombre_completo: session.user.user_metadata.full_name || "", ultimo_ingreso: new Date().toISOString() });
        const { data: perfil } = await supabase.from("perfiles").select("es_admin, rol_admin, area_asignada").eq("id", session.user.id).single();
        setAdminData(perfil);
        await cargarCursos();
    };

    if (!sesion) return <div className="pantalla-inicio min-h-screen flex items-center justify-center"><button onClick={() => supabase.auth.signInWithOAuth({ provider: "google", options: { queryParams: { hd: DOMINIO, prompt: "select_account" } }})} className="bg-white px-6 py-3 rounded-xl font-bold">Ingresar con Google institucional</button></div>;
    if (ruta.vista === "admin") return <PanelAdmin sesion={sesion} adminData={adminData} cursos={cursos} recargarCursos={cargarCursos} />;
    if (ruta.vista === "curso") return <Curso curso={cursos.find(c => c.id === ruta.cursoId)} sesion={sesion} />;
    return <Portal sesion={sesion} adminData={adminData} cursos={cursos} onCerrarSesion={() => supabase.auth.signOut()} />;
};

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
