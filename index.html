<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Capacitación - Ministerio de Ciencia</title>
<script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Exportación a Excel y gráficos del panel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; color: #1a202c; }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .slide-up { animation: slideUp 0.5s ease-out forwards; opacity: 0; transform: translateY(20px); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .certificate-bg { background-color: #ffffff; background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="%23e2e8f0" stroke-width="0.5" opacity="0.5"/></svg>'); }
    @media print { body * { visibility: hidden; } #certificate-print-area, #certificate-print-area * { visibility: visible; } #certificate-print-area { position: absolute; left: 0; top: 0; width: 100%; height: 100%; } .print-hidden { display: none !important; } body { background-color: white; } }
    :root { --azul-fondo: #e6eef8; --azul-tarjeta: #f3f8fe; --azul-tenue: #e8f0fa; --azul-borde: #d5e3f2; --azul-campo: #fbfdff; }
    body { background-color: var(--azul-fondo); background-image: linear-gradient(180deg, #edf3fa 0%, var(--azul-fondo) 55%, #dde8f5 100%); background-attachment: fixed; }
    .bg-white { background-color: var(--azul-tarjeta) !important; }
    .bg-gray-50 { background-color: var(--azul-tenue) !important; }
    .bg-gray-100 { background-color: #e4ecf7 !important; }
    .border-gray-100 { border-color: var(--azul-borde) !important; }
    .border-gray-200 { border-color: #cddef0 !important; }
    .border-gray-300 { border-color: #bcd2e8 !important; }
    input, select, textarea { background-color: var(--azul-campo); }
    input[readonly] { background-color: #e4ecf7; }
    .pantalla-inicio { background-image: linear-gradient(160deg, #0a1836 0%, #14306b 50%, #1e3a8a 100%); }
    .logo-cabecera { border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="config.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const DOMINIO = window.DOMINIO_PERMITIDO;
const AREAS = window.AREAS_MINISTERIO || ["General"];

function esCorreoValido(email) { return !!email && email.toLowerCase().endsWith("@" + DOMINIO); }
const irA = (ruta) => { window.location.hash = ruta; };

const Logo = ({ clase = "h-12", fallback = "text-blue-600 text-5xl" }) => {
    const [falla, setFalla] = useState(false);
    if (!window.LOGO_URL || falla) return <div className={fallback}><i className="fa-solid fa-building-columns"></i></div>;
    return <img src={window.LOGO_URL} alt="Ministerio de Ciencia" className={`${clase} w-auto object-contain`} onError={() => setFalla(true)} />;
};

const formatearRut = (valor) => {
    let limpio = valor.replace(/[^0-9kK]/g, "").toUpperCase().replace(/K(?=.)/g, "");
    if (limpio.length > 9) limpio = limpio.slice(0, 9);
    if (limpio.length <= 1) return limpio;
    return limpio.slice(0, -1) + "-" + limpio.slice(-1);
};

const rutValido = (rut) => {
    const limpio = (rut || "").replace(/[.\-]/g, "").toUpperCase();
    if (!/^[0-9]{7,8}[0-9K]$/.test(limpio)) return false;
    const cuerpo = limpio.slice(0, -1);
    const dv = limpio.slice(-1);
    let suma = 0, mult = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) { suma += parseInt(cuerpo[i], 10) * mult; mult = mult === 7 ? 2 : mult + 1; }
    const resto = 11 - (suma % 11);
    const dvEsperado = resto === 11 ? "0" : resto === 10 ? "K" : String(resto);
    return dv === dvEsperado;
};

// ============================================================
// CURSO SEMILLA
// ============================================================
const CURSO_SEMILLA = {
    id: "probidad-2026", titulo: "Probidad y Conflictos de Interés en el Estado",
    descripcion: "Curso obligatorio sobre la Ley 20.880.", area: "Auditoría Interna",
    icono: "fa-scale-balanced", color: "bg-blue-600", publicado: true, orden: 0,
    video_url: "https://drive.google.com/file/d/12lz0lYf72sYxuwQqj68Pn5PbOMe6ZBDM/preview", video_duracion: 0,
    modulos: [{titulo: "1. Fundamentos", icono: "fa-scale-balanced", teoria: "El principio de probidad exige mantener una conducta funcionaria intachable."}],
    preguntas: [{enunciado: "1. ¿Qué es el conflicto de interés?", opciones: ["A", "B", "C", "D"], correcta: 1, explicacion: "Es la concurrencia..."}]
};

const COLORES = [{ valor: "bg-blue-600", nombre: "Azul" }, { valor: "bg-emerald-600", nombre: "Verde" }, { valor: "bg-amber-600", nombre: "Ámbar" }, { valor: "bg-rose-600", nombre: "Rojo" }, { valor: "bg-violet-600", nombre: "Violeta" }, { valor: "bg-slate-700", nombre: "Gris" }];
const ICONOS = ["fa-scale-balanced", "fa-shield-halved", "fa-book", "fa-graduation-cap", "fa-laptop-code", "fa-users", "fa-file-contract", "fa-lightbulb", "fa-heart-pulse", "fa-leaf", "fa-lock", "fa-chart-line"];

// ============================================================
// VISTA: CURSO
// ============================================================
const Curso = ({ curso, sesion }) => {
    const modulos = curso.modulos || [];
    const preguntas = curso.preguntas || [];

    const [vista, setVista] = useState('registro');
    const [datos, setDatos] = useState({ nombre: sesion.user.user_metadata.full_name || sesion.user.email, rut: '' });
    const [errores, setErrores] = useState({});
    const [guardando, setGuardando] = useState(false);
    const [moduloActivo, setModuloActivo] = useState(0);
    const [indicePregunta, setIndicePregunta] = useState(0);
    const [respuestas, setRespuestas] = useState([]);
    const [puntaje, setPuntaje] = useState(0);
    const [mostrarExp, setMostrarExp] = useState(false);
    
    // ESTADO PARA EL TEMPORIZADOR DEL VIDEO
    const [tiempoVideo, setTiempoVideo] = useState(0);
    const scrollRef = useRef(null);

    useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' }); }, [moduloActivo, indicePregunta, vista]);

    // EFECTO DEL TEMPORIZADOR
    useEffect(() => {
        if (moduloActivo === -1 && curso.video_duracion > 0) {
            setTiempoVideo(curso.video_duracion);
        }
    }, [moduloActivo, curso.video_duracion]);

    useEffect(() => {
        let timer;
        if (moduloActivo === -1 && tiempoVideo > 0) {
            timer = setInterval(() => setTiempoVideo(prev => prev - 1), 1000);
        }
        return () => clearInterval(timer);
    }, [moduloActivo, tiempoVideo]);

    const validar = () => {
        const e = {};
        if (!datos.rut.trim()) e.rut = 'El RUT es obligatorio.';
        else if (!rutValido(datos.rut)) e.rut = 'El RUT no es válido.';
        setErrores(e); return Object.keys(e).length === 0;
    };

    const guardarInscripcion = async () => {
        setGuardando(true);
        await supabase.from('inscripciones').upsert({ user_id: sesion.user.id, curso_id: curso.id, email: sesion.user.email, nombre: datos.nombre, rut: datos.rut, iniciado_en: new Date().toISOString() }, { onConflict: 'user_id,curso_id' });
        setGuardando(false);
    };

    const guardarCertificado = async (pct, aprobado) => {
        await supabase.from('certificados').upsert({ user_id: sesion.user.id, curso_id: curso.id, email: sesion.user.email, nombre: datos.nombre, rut: datos.rut, puntaje: pct, aprobado: aprobado, emitido_en: new Date().toISOString() }, { onConflict: 'user_id,curso_id' });
    };

    const enviarRegistro = async (e) => { e.preventDefault(); if (validar()) { await guardarInscripcion(); setVista('bienvenida'); } };
    const comenzar = () => { setVista('modulos'); setModuloActivo(curso.video_url ? -1 : 0); };
    const siguienteModulo = () => { if (moduloActivo < modulos.length - 1) setModuloActivo(moduloActivo + 1); else { setVista('quiz'); setIndicePregunta(0); setRespuestas([]); setPuntaje(0); setMostrarExp(false); } };
    const anteriorModulo = () => { const minimo = curso.video_url ? -1 : 0; if (moduloActivo > minimo) setModuloActivo(moduloActivo - 1); };
    const responder = (idx) => { if (mostrarExp) return; if (idx === preguntas[indicePregunta].correcta) setPuntaje(puntaje + 1); const n = [...respuestas]; n[indicePregunta] = idx; setRespuestas(n); setMostrarExp(true); };
    const siguientePregunta = () => { setMostrarExp(false); if (indicePregunta < preguntas.length - 1) setIndicePregunta(indicePregunta + 1); else { setVista('resultados'); const pct = Math.round((puntaje / preguntas.length) * 100); guardarCertificado(pct, pct >= 80); } };

    const registro = () => (
        <div className="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center slide-up w-full max-w-md mx-auto">
            <div className="bg-white p-8 rounded-3xl shadow-2xl border border-gray-100 w-full relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                <h2 className="text-2xl font-bold text-gray-800 mb-2">Confirma tus datos</h2>
                <form onSubmit={enviarRegistro} className="space-y-5 text-left">
                    <div><label className="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label><input type="text" value={datos.nombre} readOnly className="w-full px-4 py-3 rounded-xl border border-gray-200" /></div>
                    <div><label className="block text-sm font-semibold text-gray-700 mb-1">RUT (sin puntos, con guion)</label><input type="text" maxLength={10} value={datos.rut} onChange={(e) => setDatos({...datos, rut: formatearRut(e.target.value)})} placeholder="Ej: 12345678-9" className="w-full px-4 py-3 rounded-xl border border-gray-300" /></div>
                    <button type="submit" disabled={guardando} className="w-full bg-blue-700 text-white font-bold py-3 px-4 rounded-xl mt-4">Continuar</button>
                </form>
            </div>
        </div>
    );

    const bienvenida = () => (
        <div className="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center slide-up">
            <h1 className="text-4xl font-extrabold text-gray-800 mb-2">{curso.titulo}</h1>
            <p className="text-blue-600 font-semibold mb-6">Bienvenido/a, {datos.nombre}</p>
            <p className="text-xl text-gray-600 max-w-3xl mb-8">{curso.descripcion}</p>
            <button onClick={comenzar} className="bg-blue-700 text-white font-bold py-4 px-10 rounded-full">Comenzar Curso</button>
        </div>
    );

    const vistaModulos = () => {
        if (moduloActivo === -1) {
            return (
                <div className="max-w-4xl mx-auto w-full slide-up">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-8">
                        <h2 className="text-2xl font-bold text-gray-800 mb-4"><i className="fa-solid fa-circle-play text-red-600 mr-2"></i> Video del curso</h2>
                        <div className="bg-black rounded-xl overflow-hidden relative mb-6" style={{ paddingBottom: '56.25%', height: 0 }}>
                            <iframe className="absolute top-0 left-0 w-full h-full" src={curso.video_url} frameBorder="0" allowFullScreen></iframe>
                        </div>
                        <div className="flex flex-col items-end gap-4 mt-8 border-t border-gray-100 pt-6">
                            {tiempoVideo > 0 ? (
                                <button disabled className="bg-gray-200 text-gray-500 px-8 py-3 rounded-lg font-bold cursor-not-allowed">
                                    <i className="fa-solid fa-clock mr-2"></i> Aparece en {Math.floor(tiempoVideo / 60)}:{String(tiempoVideo % 60).padStart(2, '0')}
                                </button>
                            ) : (
                                <button onClick={siguienteModulo} className="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-bold shadow-md transition-all">
                                    Continuar <i className="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const mod = modulos[moduloActivo];
        if (!mod) return null;
        return (
            <div className="max-w-4xl mx-auto w-full slide-up">
                <div className="bg-white rounded-2xl shadow-xl border border-gray-100">
                    <div className="bg-slate-800 p-6 flex items-center gap-4"><div className="bg-white/20 p-3 rounded-lg text-white"><i className={`fa-solid ${mod.icono} text-3xl`}></i></div><h2 className="text-2xl font-bold text-white">{mod.titulo}</h2></div>
                    <div className="p-8 space-y-6"><p className="text-gray-700 text-lg whitespace-pre-line">{mod.teoria}</p></div>
                    <div className="bg-gray-50 p-5 flex justify-between"><button onClick={anteriorModulo} className="text-blue-600 font-semibold">Anterior</button><button onClick={siguienteModulo} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Siguiente</button></div>
                </div>
            </div>
        );
    };

    const vistaQuiz = () => {
        const p = preguntas[indicePregunta];
        const respondida = mostrarExp;
        const acerto = respuestas[indicePregunta] === p.correcta;

        return (
            <div className="max-w-3xl mx-auto w-full slide-up">
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-8">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6">{p.enunciado}</h2>
                    <div className="space-y-4 mb-8">
                        {p.opciones.map((opt, idx) => {
                            let estilo = "border-gray-200 text-gray-700 hover:border-indigo-400";
                            if (respondida) {
                                if (idx === respuestas[indicePregunta]) {
                                    estilo = idx === p.correcta ? "border-green-500 bg-green-50 text-green-800" : "border-red-500 bg-red-50 text-red-800";
                                } else { estilo = "border-gray-200 text-gray-400 opacity-50"; }
                            }
                            return <button key={idx} onClick={() => responder(idx)} disabled={respondida} className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 ${estilo}`}>{opt}</button>;
                        })}
                    </div>
                    {respondida && <div className="text-right border-t border-gray-100 pt-6"><button onClick={siguientePregunta} className="bg-indigo-600 text-white px-8 py-3 rounded-lg font-bold">Siguiente Pregunta</button></div>}
                </div>
            </div>
        );
    };

    const vistaResultados = () => {
        const pct = Math.round((puntaje / preguntas.length) * 100);
        return (
            <div className="max-w-2xl mx-auto w-full text-center slide-up bg-white rounded-3xl shadow-2xl p-10">
                <h2 className="text-4xl font-extrabold mb-4">Resultados</h2>
                <div className={`text-6xl font-black mb-4 ${pct >= 80 ? 'text-green-600' : 'text-red-600'}`}>{pct}%</div>
                {pct >= 80 ? <button onClick={() => setVista('certificado')} className="bg-green-600 text-white px-8 py-4 rounded-full font-bold">Obtener Certificado</button> : <button onClick={() => { setVista('modulos'); setModuloActivo(curso.video_url ? -1 : 0); setPuntaje(0); setIndicePregunta(0); setMostrarExp(false); setRespuestas([]); }} className="bg-gray-800 text-white px-8 py-4 rounded-full font-bold">Volver a Iniciar</button>}
            </div>
        );
    };

    const vistaCertificado = () => (
        <div className="w-full max-w-4xl mx-auto flex flex-col items-center slide-up pb-10">
            <div className="w-full flex justify-end mb-6 print-hidden"><button onClick={() => window.print()} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold shadow">Imprimir / PDF</button></div>
            <div id="certificate-print-area" className="w-full bg-white p-12 border-8 border-double border-blue-900 shadow-2xl text-center certificate-bg">
                <div className="flex justify-center mb-6"><Logo clase="h-24" /></div>
                <h1 className="text-5xl font-serif text-gray-800 mb-8 uppercase">Certificado de Aprobación</h1>
                <h2 className="text-4xl font-bold text-blue-900 mb-2">{datos.nombre.toUpperCase()}</h2>
                <p className="text-gray-600 font-medium mb-10">RUT: {datos.rut}</p>
                <p className="text-lg text-gray-700 mb-16">Por haber aprobado satisfactoriamente el curso <strong>{curso.titulo}</strong>.</p>
            </div>
        </div>
    );

    return (
        <div className="min-h-screen flex flex-col h-screen overflow-hidden">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center print-hidden"><a href="#/" className="font-bold flex items-center gap-3"><Logo clase="h-12" /><span>Portal de Capacitación</span></a></header>
            <main ref={scrollRef} className="flex-grow overflow-y-auto p-4 flex items-start justify-center">
                {vista === 'registro' && registro()}{vista === 'bienvenida' && bienvenida()}{vista === 'modulos' && vistaModulos()}{vista === 'quiz' && vistaQuiz()}{vista === 'resultados' && vistaResultados()}{vista === 'certificado' && vistaCertificado()}
            </main>
        </div>
    );
};

// ============================================================
// FORMULARIO DE CURSO
// ============================================================
const FormularioCurso = ({ cursoInicial, onGuardado, onCancelar, sesion }) => {
    const nuevo = !cursoInicial;
    const [c, setC] = useState(cursoInicial || { id: "", titulo: "", descripcion: "", area: "General", icono: "fa-book", color: "bg-blue-600", video_url: "", video_duracion: 0, publicado: false, orden: 0, modulos: [], preguntas: [] });
    const [guardando, setGuardando] = useState(false);
    const [error, setError] = useState("");

    const set = (campo, valor) => setC({ ...c, [campo]: valor });

    const guardar = async () => {
        setError("");
        const id = (c.id || "").trim().toLowerCase().replace(/[^a-z0-9-]/g, "-");
        if (!id) return setError("Falta el identificador.");
        setGuardando(true);
        const fila = { ...c, id, creado_por: sesion.user.id, editado_en: new Date().toISOString() };
        const { error: err } = await supabase.from("cursos").upsert(fila, { onConflict: "id" });
        setGuardando(false);
        if (err) setError("Error: " + err.message); else onGuardado();
    };

    const campo = "w-full px-3 py-2 rounded-lg border border-gray-300 text-sm";

    return (
        <div className="bg-white rounded-2xl shadow-md p-6 space-y-8">
            <h3 className="text-xl font-bold">{nuevo ? "Nuevo curso" : "Editar curso"}</h3>
            <section className="space-y-4">
                <div className="grid md:grid-cols-2 gap-4">
                    <div><label className="block text-xs font-semibold mb-1">ID (URL)</label><input className={campo} value={c.id} disabled={!nuevo} onChange={e => set("id", e.target.value)} /></div>
                    <div><label className="block text-xs font-semibold mb-1">Área</label><select className={campo} value={c.area} onChange={e => set("area", e.target.value)}>{AREAS.map(a => <option key={a} value={a}>{a}</option>)}</select></div>
                </div>
                <div><label className="block text-xs font-semibold mb-1">Título</label><input className={campo} value={c.titulo} onChange={e => set("titulo", e.target.value)} /></div>
                <div><label className="block text-xs font-semibold mb-1">Descripción</label><textarea className={campo} rows="2" value={c.descripcion || ""} onChange={e => set("descripcion", e.target.value)} /></div>
                <div className="grid md:grid-cols-2 gap-4">
                    <div>
                        <label className="block text-xs font-semibold mb-1">Enlace del video</label>
                        <input className={campo} value={c.video_url || ""} onChange={e => set("video_url", e.target.value)} placeholder="Ej: Google Drive /preview" />
                    </div>
                    <div>
                        <label className="block text-xs font-semibold mb-1 text-blue-700">Duración del video (en segundos)</label>
                        <input type="number" className={campo} value={c.video_duracion || 0} onChange={e => set("video_duracion", parseInt(e.target.value) || 0)} />
                        <p className="text-xs text-gray-500 mt-1">El botón aparecerá solo cuando pase este tiempo.</p>
                    </div>
                </div>
                <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={!!c.publicado} onChange={e => set("publicado", e.target.checked)} /> Publicado</label>
            </section>
            {error && <div className="text-red-700 text-sm">{error}</div>}
            <div className="flex justify-end gap-3"><button onClick={onCancelar} className="px-5 py-2 font-semibold">Cancelar</button><button onClick={guardar} disabled={guardando} className="bg-blue-700 text-white px-6 py-2 rounded-lg font-bold">Guardar</button></div>
        </div>
    );
};

// ============================================================
// PANEL Y APP (LÓGICA EXISTENTE MANTENIDA)
// ============================================================
const PanelAdmin = ({ sesion, adminData, cursos, recargarCursos }) => {
    const esAdmin = !!adminData?.es_admin;
    const [pestana, setPestana] = useState("cursos");
    const [editando, setEditando] = useState(null);

    if (!esAdmin) return <div className="p-10 text-center"><h1 className="text-2xl font-bold">Sin acceso</h1></div>;
    const misCursos = adminData?.rol_admin === 'supremo' ? cursos : cursos.filter(c => (c.area || 'General') === adminData?.area_asignada);

    return (
        <div className="min-h-screen">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between"><a href="#/" className="font-bold"><Logo clase="h-10" /> Panel Admin</a></header>
            <main className="max-w-6xl mx-auto p-6">
                <div className="flex gap-2 mb-6 border-b pb-4"><button onClick={() => setPestana("cursos")} className="bg-blue-700 text-white px-4 py-2 rounded-lg">Cursos</button></div>
                {pestana === "cursos" && !editando && (
                    <>
                        <button onClick={() => setEditando({})} className="bg-blue-700 text-white px-4 py-2 rounded mb-4">Nuevo Curso</button>
                        <div className="grid sm:grid-cols-2 gap-4">
                            {misCursos.map(c => (
                                <div key={c.id} className="bg-white p-5 rounded-xl shadow">
                                    <h3 className="font-bold">{c.titulo}</h3><button onClick={() => setEditando(c)} className="text-blue-600 mt-2">Editar</button>
                                </div>
                            ))}
                        </div>
                    </>
                )}
                {pestana === "cursos" && editando && <FormularioCurso cursoInicial={editando.id ? editando : null} sesion={sesion} onCancelar={() => setEditando(null)} onGuardado={() => { setEditando(null); recargarCursos(); }} />}
            </main>
        </div>
    );
};

const Portal = ({ sesion, adminData, cursos, onCerrarSesion }) => {
    const visibles = cursos.filter(c => c.publicado || !!adminData?.es_admin);
    const areasActivas = [...new Set(visibles.map(c => c.area || 'General'))].sort();
    return (
        <div className="min-h-screen">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between"><a href="#/" className="font-bold"><Logo clase="h-10" /> Portal</a>{adminData?.es_admin && <a href="#/admin" className="bg-blue-700 px-3 py-1 rounded">Panel Admin</a>}</header>
            <main className="max-w-5xl mx-auto p-6">
                {areasActivas.map(area => (
                    <div key={area} className="mb-12">
                        <h2 className="text-xl font-bold text-blue-900 border-b-2 pb-2 mb-6">{area}</h2>
                        <div className="grid sm:grid-cols-2 gap-6">
                            {visibles.filter(c => (c.area || 'General') === area).map(curso => (
                                <a key={curso.id} href={`#/curso/${curso.id}`} className="bg-white rounded-xl shadow p-6"><h3 className="font-bold">{curso.titulo}</h3><span className="text-blue-600">Ingresar</span></a>
                            ))}
                        </div>
                    </div>
                ))}
            </main>
        </div>
    );
};

function leerRuta() { const h = (window.location.hash || "").replace(/^#/, ""); if (h.startsWith("/curso/")) return { vista: "curso", cursoId: h.slice(7) }; if (h === "/admin") return { vista: "admin" }; return { vista: "portal" }; }

const App = () => {
    const [cargando, setCargando] = useState(true);
    const [sesion, setSesion] = useState(null);
    const [adminData, setAdminData] = useState(null);
    const [cursos, setCursos] = useState([]);
    const [ruta, setRuta] = useState(leerRuta());

    useEffect(() => { const alCambiar = () => setRuta(leerRuta()); window.addEventListener("hashchange", alCambiar); return () => window.removeEventListener("hashchange", alCambiar); }, []);

    const cargarCursos = async () => {
        const { data } = await supabase.from("cursos").select("*").order("orden");
        const lista = data || []; if (!lista.some(c => c.id === CURSO_SEMILLA.id)) lista.push({ ...CURSO_SEMILLA, esSemilla: true });
        setCursos(lista);
    };

    useEffect(() => {
        supabase.auth.getSession().then(({ data }) => manejarSesion(data.session));
        const { data: listener } = supabase.auth.onAuthStateChange((_e, s) => manejarSesion(s));
        return () => listener.subscription.unsubscribe();
    }, []);

    const manejarSesion = async (session) => {
        if (!session || !esCorreoValido(session.user.email)) { setSesion(null); setCargando(false); return; }
        setSesion(session);
        await supabase.from("perfiles").upsert({ id: session.user.id, email: session.user.email, nombre_completo: session.user.user_metadata.full_name || "" });
        const { data: perfil } = await supabase.from("perfiles").select("es_admin, rol_admin, area_asignada").eq("id", session.user.id).single();
        setAdminData(perfil); await cargarCursos(); setCargando(false);
    };

    if (cargando) return <div className="p-10">Cargando...</div>;
    if (!sesion) return <div className="p-10"><button onClick={() => supabase.auth.signInWithOAuth({ provider: "google", options: { queryParams: { hd: DOMINIO } }})} className="bg-blue-600 text-white px-4 py-2">Ingresar con Google</button></div>;
    if (ruta.vista === "admin") return <PanelAdmin sesion={sesion} adminData={adminData} cursos={cursos} recargarCursos={cargarCursos} />;
    if (ruta.vista === "curso") return <Curso key={ruta.cursoId} curso={cursos.find(c => c.id === ruta.cursoId)} sesion={sesion} />;
    return <Portal sesion={sesion} adminData={adminData} cursos={cursos} />;
};

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
